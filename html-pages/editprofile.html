<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/0c657a5b56.js"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
  </head>
  <body class="bg-background flex min-h-screen flex-col">
    <header id="navbar"></header>
    <main
      class="flex flex-1 flex-col items-center justify-center gap-8 pb-24 md:p-0 md:py-10"
    >
      <img src="/assets/logo/logo_small.png" class="mt-10 md:hidden" />
      <section
        id="credits-mobile"
        class="from-primary-blue to-gradient-blue text-md rounded-lg bg-linear-to-r px-4 py-2 text-center text-white md:hidden"
      >
        <i class="fa-solid fa-coins"></i>1000
      </section>
      <div
        class="w-full max-w-sm rounded-lg bg-white px-10 py-8 shadow-xl md:max-w-md"
      >
        <h1 class="text-primary-blue mb-6 text-center text-2xl font-bold">
          Rediger profil
        </h1>
        <form id="edit-profile" class="flex flex-col gap-3">
          <section class="flex flex-col gap-2">
            <label for="edit-profile-banner">Forsidebilde</label>
            <input
              id="edit-profile-banner"
              name="profile-banner"
              type="url"
              placeholder="Bilde URL"
              class="w-full rounded-md border px-2 py-2"
            />
          </section>
          <section class="flex flex-col gap-2">
            <label for="edit-profile-img">Profilbilde</label>
            <input
              id="edit-profile-img"
              name="profile-img"
              type="url"
              placeholder="Bilde URL"
              class="w-full rounded-md border px-2 py-2"
            />
          </section>
          <section class="flex flex-col gap-2">
            <label for="edit-description">Biografi</label>
            <textarea
              id="edit-description"
              name="description"
              placeholder="F.eks: “Selger bøker og antikviteter fra loftet mitt siden 2020”"
              rows="10"
              class="w-full rounded-md border px-2 py-2"
              maxlength="160"
            ></textarea>
          </section>
          <button
            type="submit"
            class="bg-primary-blue mt-4 rounded-lg py-3 font-semibold text-white"
          >
            Oppdater profil
          </button>
        </form>
        <div
          id="message"
          class="bg-red-warning mt-6 flex hidden items-center gap-4 rounded-md px-4 py-4 shadow-md"
        >
          <i class="fa-solid fa-xmark text-xl text-white"></i>
          <div>
            <p id="message-title" class="font-bold text-white">
              Kunne ikke hente profilen du vil oppdatere
            </p>
            <p class="text-sm text-white">Vennligst prøv igjen</p>
          </div>
        </div>
        <div
          id="success-message"
          class="bg-green-success mt-6 flex hidden items-center gap-4 rounded-md px-4 py-4 shadow-md"
        >
          <i class="fa-solid fa-circle-check text-green-text text-xl"></i>
          <div>
            <p id="message-title-success" class="text-green-text font-bold">
              Profilen din ble oppdatert!
            </p>
            <p class="text-green-text text-sm">La oss se på den!</p>
          </div>
        </div>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/editprofile.js"></script>
  </body>
</html>
