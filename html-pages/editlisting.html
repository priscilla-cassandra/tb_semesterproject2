<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/favicon(1).ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/0c657a5b56.js"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
  </head>
  <body class="bg-background flex min-h-screen flex-col">
    <header id="navbar"></header>
    <main
      class="flex flex-1 flex-col items-center justify-center gap-8 pb-24 md:p-0 md:py-10"
    >
      <a href="/index.html">
        <img src="/assets/logo/logo_small.png" class="mt-10 md:hidden" />
      </a>
      <div id="credits-mobile" class="md:hidden"></div>
      <div
        class="w-full max-w-sm rounded-lg bg-white px-10 py-8 shadow-xl md:max-w-md"
      >
        <h1 class="text-primary-blue mb-6 text-center font-bold">
          Endre annonse
        </h1>
        <form id="edit-listing-form" class="flex flex-col gap-3">
          <section class="flex flex-col gap-2">
            <label for="edit-title">Tittel</label>
            <input
              id="edit-title"
              name="title"
              type="text"
              placeholder="eks. Telefon"
              required
              class="w-full rounded-md border px-2 py-2"
            />
          </section>
          <section class="flex flex-col gap-2">
            <label for="edit-main-img">Hovedbilde</label>
            <input
              id="edit-main-img"
              name="main-img"
              type="url"
              placeholder="Bilde URL"
              class="w-full rounded-md border px-2 py-2"
            />
          </section>
          <div id="extra-img-container" class="flex flex-col gap-2"></div>
          <button
            type="button"
            id="add-img-btn"
            class="bg-primary-blue w-2/3 rounded-lg py-2 font-semibold text-white"
          >
            + Legg til flere bilder
          </button>
          <section class="flex flex-col gap-2">
            <label for="edit-description">Beskrivelse</label>
            <textarea
              id="edit-description"
              name="description"
              placeholder="Beskrivelse hva du selger"
              rows="10"
              class="w-full rounded-md border px-2 py-2"
              required
            ></textarea>
          </section>
          <section class="flex flex-col gap-2">
            <label for="edit-auction-end">Auksjon avsluttes</label>
            <input
              id="edit-auction-end"
              name="auction-end"
              type="datetime-local"
              class="w-full rounded-md border px-2 py-2"
              required
            />
          </section>
          <button
            id="update-button"
            type="submit"
            class="bg-primary-blue hover:bg-primary-blue-hover mt-4 cursor-pointer rounded-lg py-3 font-semibold text-white"
          >
            Oppdater annonse
          </button>
          <button
            id="delete-btn"
            type="button"
            class="bg-red-warning-hover hover:bg-red-warning cursor-pointer rounded-lg py-3 font-semibold text-white"
          >
            Slett annonse
          </button>
        </form>
        <div
          id="message"
          class="bg-red-warning mt-6 flex hidden items-center gap-4 rounded-md px-4 py-4 shadow-md"
        >
          <i class="fa-solid fa-xmark text-xl text-white"></i>
          <div>
            <p id="message-title" class="font-bold text-white">
              Kunne ikke oppdatere annonsen.
            </p>
            <p class="text-sm text-white">Vennligst prøv igjen</p>
          </div>
        </div>
        <div
          id="success-message"
          class="bg-green-success mt-6 flex hidden items-center gap-4 rounded-md px-4 py-4 shadow-md"
        >
          <i class="fa-solid fa-circle-check text-green-text text-xl"></i>
          <div>
            <p id="message-title-success" class="text-green-text font-bold">
              Annonsen din ble oppdatert!
            </p>
            <p class="text-green-text text-sm">La oss se på den!</p>
          </div>
        </div>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/editlisting.js"></script>
  </body>
</html>
