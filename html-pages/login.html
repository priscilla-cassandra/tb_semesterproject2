<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/0c657a5b56.js"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
  </head>
  <body class="bg-background flex min-h-screen flex-col">
    <header id="navbar"></header>
    <main
      class="mx-auto flex flex-1 flex-col items-center justify-center gap-10 pb-24 md:p-0"
    >
      <img src="/assets/logo/logo_small.png" class="mt-10 md:hidden" />
      <div class="w-full max-w-md rounded-lg bg-white px-10 py-8 shadow-xl">
        <h1 class="text-primary-blue mb-6 text-center text-2xl font-bold">
          Logg inn
        </h1>
        <form id="login-form" class="flex flex-col gap-3">
          <section class="flex flex-col gap-2">
            <label for="email">Epost</label>
            <input
              id="email"
              name="email"
              type="email"
              pattern="[a-zA-Z0-9._%+-]+@stud\.noroff\.no"
              title="Må være en @stud.noroff.no adresse"
              required
              placeholder="ola@stud.noroff.no"
              class="w-full rounded-md border px-2 py-2"
            />
          </section>
          <section class="flex flex-col gap-2">
            <label for="password">Passord</label>
            <input
              id="password"
              name="password"
              type="password"
              class="w-full rounded-md border px-2 py-2"
              placeholder="xxxxxxxx"
              required
            />
          </section>
          <button
            type="submit"
            class="bg-primary-blue mt-4 rounded-lg py-2 font-semibold text-white"
          >
            Logg inn
          </button>
        </form>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/components/footer.js"></script>
    <script type="module" src="/src/components/navbar.js"></script>
  </body>
</html>
