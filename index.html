<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/0c657a5b56.js"
      crossorigin="anonymous"
    ></script>
    <title>Hjem | TrønderBørs</title>
  </head>
  <body class="bg-background flex min-h-screen flex-col">
    <header id="navbar"></header>
    <img
      src="/assets/images/trondheim_hero.jpg"
      alt="Bryggehusene langs nidelven i Trondheim"
      class="hidden h-[350px] w-full object-cover object-[center_30%] md:block 2xl:h-[700px]"
    />
    <main
      class="flex flex-1 flex-col pb-24 md:mx-auto md:max-w-4xl md:p-2 lg:max-w-5xl xl:max-w-7xl"
    >
      <img
        src="/assets/logo/logo_small.png"
        class="mt-8 self-center md:hidden"
        alt="TrønderBørs logo"
      />
      <p
        class="text-primary-blue self-center py-4 font-semibold italic md:text-lg xl:text-xl"
      >
        "Der trønderske ting får ny verdi"
      </p>
      <div id="searchbar" class="mx-auto w-full lg:max-w-2xl"></div>
      <div class="mt-10 w-full px-6">
        <div class="flex items-center justify-between">
          <div class="mb-6 flex flex-col gap-3">
            <label for="sort">Sorter etter</label>
            <select id="sort" name="sort" class="bg-white px-1 py-1 shadow-md">
              <option value="newest">Nyeste</option>
              <option value="no-bids">Auksjoner uten bud</option>
              <option value="active-listings">Aktive auksjoner</option>
            </select>
          </div>
          <div id="credits-mobile" class="md:hidden"></div>
        </div>

        <section
          id="listing-grid"
          class="grid grid-cols-2 gap-2 md:grid-cols-3 md:gap-4 xl:grid-cols-4"
        ></section>
        <section id="pagination-container"></section>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/index.js"></script>
  </body>
</html>
