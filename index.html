<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/0c657a5b56.js"
      crossorigin="anonymous"
    ></script>
    <title>Hjem | TrønderBørs</title>
  </head>
  <body class="bg-background flex min-h-screen flex-col">
    <header id="navbar"></header>
    <img
      src="/assets/images/trondheim_hero.jpg"
      alt="Bryggehusene langs nidelven i Trondheim"
      class="hidden h-[350px] w-full object-cover object-[center_30%] md:block 2xl:h-[700px]"
    />
    <main class="flex flex-1 flex-col pb-24 md:mx-auto md:p-0 2xl:max-w-3/4">
      <img
        src="/assets/logo/logo_small.png"
        class="mt-8 self-center md:hidden"
        alt="TrønderBørs logo"
      />
      <p class="text-primary-blue self-center">
        "Der trønderske ting får ny verdi"
      </p>
      <div id="searchbar" class="w-full"></div>
      <div class="mt-10 w-full px-6">
        <div class="flex items-center justify-between">
          <div class="mb-6 flex flex-col gap-3">
            <label for="sort">Sorter etter</label>
            <select id="sort" name="sort" class="bg-white px-1 py-1 shadow-md">
              <option value="newest">Nyeste</option>
              <option value="ending-soon">Avsluttes snart</option>
            </select>
          </div>
          <div>
            <section
              id="credits-mobile"
              class="from-primary-blue to-gradient-blue text-md rounded-lg bg-linear-to-r px-4 py-2 text-center text-white md:hidden"
            >
              <i class="fa-solid fa-coins"></i>1000
            </section>
          </div>
        </div>

        <div
          id="listing-grid"
          class="grid grid-cols-2 gap-6 md:grid-cols-4"
        ></div>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/index.js"></script>
  </body>
</html>
